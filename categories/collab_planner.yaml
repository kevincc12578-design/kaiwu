schema_version: "4.0.0"
category_id: "collab_planner"
name: "排班 / 日历协作工具"
name_en: "Schedule & Collaborative Planner"
tier: "core"
default_domain: "uiux"
base_template_id: "tpl_uiux_workspace_v1"
description: "适用于资源排班、周计划日历矩阵、工时实时汇总与协作者状态感知的轻量协作工具。"
required_slots: ["nav_dock", "main_stage"]
optional_slots: ["intro_shell", "auxiliary_overlay", "region.metric_strip", "region.list"]
allowed_asset_slots: ["avatar", "paper_texture"]
expected_signals:
  preferred_aspect: "landscape"
  has_matrix_or_schedule: true
  min_interactive_controls: 8
  keywords: ["week", "schedule", "calendar", "planner", "mon", "tue", "wed", "hours", "capacity", "weeksync", "task", "sync"]
category_rules:
  - id: "CAT-PLAN-01"
    name: "二维时间矩阵可编辑 DOM"
    metric_key: "editable_schedule_matrix"
    desc: "排班单元格与任务条目均以可选中真 DOM 渲染，而非静态图片拼接。"
  - id: "CAT-PLAN-02"
    name: "增删块与工时汇总守恒"
    metric_key: "hours_rollup_consistency"
    desc: "具备筛选/状态触发交互闭环与汇总视图节点，支持数据同口径导出。"
  - id: "CAT-PLAN-03"
    name: "阵列折叠控制扇出复杂度"
    metric_key: "matrix_complexity_bound"
    desc: "同类重复任务/资源单元通过 FOLD_ARRAY 折叠或受控度约束承载。"
