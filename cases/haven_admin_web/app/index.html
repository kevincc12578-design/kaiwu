<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4e4c4a">
    <title>Haven · Glass Admin Workspace</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-panel" data-eu-id="eu_L3_hv_skip_entry">Skip to workspace</a>
    <div class="spatial-room" aria-hidden="true"></div>
    <div id="workspace" class="workspace" data-eu-id="eu_L0_hv_workspace" aria-label="Haven Glass Admin Workspace">
      <aside id="rail" class="hv-rail" data-eu-id="eu_L1_hv_nav" aria-label="Icon rail navigation"></aside>
      <main id="main-panel" class="main-glass" data-eu-id="eu_L1_hv_stage" tabindex="-1"></main>
    </div>
    <dialog id="hvDialog" class="hv-dialog" data-eu-id="eu_L3_hv_quick_dialog" aria-labelledby="hv-dlg-title"></dialog>
    <div id="hvToast" class="hv-toast" role="status" aria-live="polite"></div>
    <noscript>Enable JavaScript to inspect Haven workspace.</noscript>
  </body>
</html>
