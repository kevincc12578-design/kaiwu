<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#261f1b">
    <title>Refract · Liquid-Glass CRM Workspace</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-panel" data-eu-id="eu_L3_rf_skip_entry">Skip to workspace</a>
    <div class="room-bg" aria-hidden="true"></div>
    <div id="workspace" class="workspace" data-eu-id="eu_L0_rf_workspace" aria-label="Refract Liquid-Glass CRM">
      <aside id="sidebar" class="sidebar" data-eu-id="eu_L1_rf_nav" aria-label="Primary CRM navigation"></aside>
      <main id="main-panel" class="main-glass" data-eu-id="eu_L1_rf_stage" tabindex="-1"></main>
    </div>
    <dialog id="rfDialog" class="rf-dialog" data-eu-id="eu_L3_rf_cmd_dialog" aria-labelledby="rf-dialog-title"></dialog>
    <div id="rfToast" class="rf-toast" role="status" aria-live="polite"></div>
    <noscript>Enable JavaScript to inspect Refract CRM.</noscript>
  </body>
</html>
